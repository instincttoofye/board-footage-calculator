[package]
name = "board-footage-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }

sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "rust_decimal"
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

uuid = { version = "1", features = ["serde", "v4"] }
rust_decimal = {
    version = "1",
    features = ["serde", "serde-with-float"]
}

dotenvy = "0.15"